<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Cầu Lông Linh Đàm</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6b3a;
            --light-green: #128c4b;
            --accent-orange: #f36f21;
            --accent-yellow: #ffcc00;
            --dark: #111111;
            --light-bg: #f4fcf7;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark);
            line-height: 1.6;
        }

        .top-bar {
            background: linear-gradient(90deg, var(--primary-green), var(--accent-orange));
            color: var(--white);
            text-align: center;
            padding: 10px 15px;
            font-weight: 700;
            font-size: 15px;
        }

        header {
            background: var(--white);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container img {
            height: 55px;
            width: auto;
        }

        .logo-text h1 {
            font-size: 20px;
            color: var(--primary-green);
            font-weight: 800;
            text-transform: uppercase;
        }

        .logo-text p {
            font-size: 11px;
            color: var(--accent-orange);
            font-weight: 700;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: var(--accent-orange);
        }

        .btn-cta {
            background: var(--accent-orange);
            color: var(--white) !important;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700 !important;
            box-shadow: 0 4px 10px rgba(243, 111, 33, 0.3);
            transition: 0.3s;
        }

        .btn-cta:hover {
            background: #d45b15;
            transform: translateY(-2px);
        }

        .hero {
            background: linear-gradient(135deg, rgba(11, 107, 58, 0.92), rgba(18, 140, 75, 0.88)), url('https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            color: var(--white);
            padding: 80px 20px;
            text-align: center;
        }

        .hero-badge {
            background: var(--accent-orange);
            color: var(--white);
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero h2 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: var(--accent-yellow);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 18px;
            max-width: 700px;
            margin: 0 auto 30px auto;
            font-weight: 500;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-main {
            background: var(--accent-orange);
            color: var(--white);
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-main:hover {
            background: #d45b15;
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--primary-green);
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .btn-secondary:hover {
            background: #f0f0f0;
            transform: translateY(-3px);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h3 {
            font-size: 32px;
            color: var(--primary-green);
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #555;
            font-size: 16px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--white);
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border-top: 5px solid var(--accent-orange);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(11, 107, 58, 0.15);
        }

        .card h4 {
            font-size: 22px;
            color: var(--primary-green);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card ul {
            list-style: none;
            margin-top: 15px;
        }

        .card ul li {
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
            font-size: 15px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card ul li i {
            color: var(--accent-orange);
        }

        .facility-banner {
            margin-top: 40px;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .facility-banner img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 480px;
            object-fit: cover;
        }

        .tournament-section {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.06);
            margin-top: 40px;
            border-left: 6px solid var(--accent-yellow);
        }

        .tournament-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .tournament-grid {
                grid-template-columns: 1fr;
            }
            nav ul {
                display: none;
            }
        }

        .tournament-info h4 {
            font-size: 26px;
            color: var(--primary-green);
            margin-bottom: 15px;
            font-weight: 800;
        }

        .tournament-info p {
            margin-bottom: 15px;
            color: #555;
            font-size: 15px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .gallery-grid img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .gallery-grid img:hover {
            transform: scale(1.05);
        }

        .booking-section {
            background: linear-gradient(135deg, var(--primary-green), var(--light-green));
            color: var(--white);
            border-radius: 20px;
            padding: 50px 30px;
            margin-top: 50px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(11, 107, 58, 0.2);
        }

        .booking-section h3 {
            font-size: 32px;
            color: var(--accent-yellow);
            margin-bottom: 15px;
            font-weight: 900;
        }

        .booking-form {
            max-width: 650px;
            margin: 30px auto 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .booking-form input, .booking-form select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            outline: none;
        }

        .booking-form .full-width {
            grid-column: span 2;
        }

        #khuVucGroup {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            background: var(--accent-orange);
            color: var(--white);
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            background: #d45b15;
        }

        footer {
            background: var(--dark);
            color: var(--white);
            padding: 50px 20px 20px 20px;
            margin-top: 60px;
        }

        .footer-content {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .footer-col h5 {
            font-size: 18px;
            color: var(--accent-yellow);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .footer-col p, .footer-col a {
            color: #bbb;
            font-size: 14px;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
            transition: 0.3s;
        }

        .footer-col a:hover {
            color: var(--accent-orange);
        }

        .social-links {
            display: flex;
            gap: 12px;
