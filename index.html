<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Cầu Lông Linh Đàm</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6b3a;
            --light-green: #128c4b;
            --accent-orange: #f36f21;
            --accent-yellow: #ffcc00;
            --dark: #111111;
            --light-bg: #f4fcf7;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark);
            line-height: 1.6;
        }

        .top-bar {
            background: linear-gradient(90deg, var(--primary-green), var(--accent-orange));
            color: var(--white);
            text-align: center;
            padding: 10px 15px;
            font-weight: 700;
            font-size: 14px;
        }

        header {
            background: var(--white);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container img {
            height: 50px;
            width: auto;
        }

        .logo-text h1 {
            font-size: 18px;
            color: var(--primary-green);
            font-weight: 800;
            text-transform: uppercase;
        }

        .logo-text p {
            font-size: 10px;
            color: var(--accent-orange);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: var(--accent-orange);
        }

        .btn-cta {
            background: var(--accent-orange);
            color: var(--white) !important;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700 !important;
            box-shadow: 0 4px 10px rgba(243, 111, 33, 0.3);
            transition: 0.3s;
        }

        .btn-cta:hover {
            background: #d45b15;
            transform: translateY(-2px);
        }

        .hero {
            background: linear-gradient(135deg, rgba(11, 107, 58, 0.92), rgba(18, 140, 75, 0.88)), url('https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            color: var(--white);
            padding: 70px 20px;
            text-align: center;
        }

        .hero-badge {
            background: var(--accent-orange);
            color: var(--white);
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero h2 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: var(--accent-yellow);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 16px;
            max-width: 700px;
            margin: 0 auto 25px auto;
            font-weight: 500;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-main {
            background: var(--accent-orange);
            color: var(--white);
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-main:hover {
            background: #d45b15;
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--primary-green);
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .btn-secondary:hover {
            background: #f0f0f0;
            transform: translateY(-3px);
        }

            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 20px;
        }
